services:
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes: ["ollama:/root/.ollama"]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:3b"]
    restart: "no"

  bot:
    build:
      context: ./src/modules/chatbot
      dockerfile: Dockerfile
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434

volumes:
  ollama:
